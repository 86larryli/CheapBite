name: Release

# Publishes to the Chrome Web Store and creates a GitHub Release.
# Trigger by pushing a version tag that matches the manifest version:
#   (bump extension/manifest.json + package.json, commit, then)
#   git tag v0.1.0 && git push origin v0.1.0
# Or run manually (workflow_dispatch) with publish=false to upload a draft.
# One-time secrets + setup are documented in docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the public store (false = upload a draft only)"
        type: boolean
        default: true

permissions:
  contents: write # to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package & publish to Chrome Web Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # On a tag build, the manifest version MUST equal the tag (minus the "v").
      - name: Verify manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./extension/manifest.json').version")"
          echo "tag=$TAG  manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match extension/manifest.json version $MANIFEST"
            exit 1
          fi

      # Zip the CONTENTS of extension/ (manifest.json at the zip root).
      # node_modules/, test/, docs/ live at the repo root, not under extension/,
      # so they are excluded automatically; the -x guards cover stray files.
      - name: Package extension
        run: |
          mkdir -p dist
          ( cd extension && zip -r -X "../dist/cheapbite-${GITHUB_REF_NAME}.zip" . \
              -x '.DS_Store' '*/.DS_Store' )
          echo "Zip contents:"; unzip -l "dist/cheapbite-${GITHUB_REF_NAME}.zip"

      - name: Upload & publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6
        with:
          file-path: dist/cheapbite-${{ github.ref_name }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # Always publish on a tag; on manual runs honor the publish toggle.
          publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cheapbite-${{ github.ref_name }}.zip
          generate_release_notes: true
