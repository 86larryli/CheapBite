name: Release

# Continuous deployment to the Chrome Web Store.
# Pushing to the `prod` branch publishes whatever version is in
# extension/manifest.json and cuts a matching GitHub Release (tag v<version>).
# Release flow: bump the version on `dev`, then promote `dev` -> `prod`.
# Run manually (workflow_dispatch) with publish=false to upload a draft only.
# One-time secrets + setup are documented in docs/RELEASING.md.

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the public store (false = upload a draft only)"
        type: boolean
        default: true

permissions:
  contents: write # to create the GitHub Release / tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package & publish to Chrome Web Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Read version from manifest
        id: ver
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      # Zip the CONTENTS of extension/ (manifest.json at the zip root).
      # node_modules/, test/, docs/ live at the repo root, not under extension/,
      # so they're excluded automatically; the -x guards cover stray files.
      - name: Package extension
        run: |
          mkdir -p dist
          ZIP="dist/cheapbite-v${{ steps.ver.outputs.version }}.zip"
          ( cd extension && zip -r -X "../$ZIP" . -x '.DS_Store' '*/.DS_Store' )
          echo "Zip contents:"; unzip -l "$ZIP"

      - name: Upload & publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6
        with:
          file-path: dist/cheapbite-v${{ steps.ver.outputs.version }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # On a prod push, always publish; on manual runs, honor the toggle.
          publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

      # On prod pushes, tag the commit and cut a GitHub Release. (A non-bumped
      # version fails the store upload above, so this step only runs for a new
      # version.) GITHUB_TOKEN-created tags don't re-trigger workflows.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/cheapbite-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
