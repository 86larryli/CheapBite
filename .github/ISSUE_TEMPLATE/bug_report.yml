name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: restaurant
    attributes:
      label: Restaurant / Google Maps page
      description: The restaurant or Maps listing where it happened (a link helps).
  - type: input
    id: channel
    attributes:
      label: Channel(s) involved
      description: e.g. "Order direct (Toast)", "Grubhub", or "all channels".
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any errors from the DevTools console or the extension's service worker.
      render: shell
  - type: input
    id: version
    attributes:
      label: Extension version
      description: From chrome://extensions (e.g. 0.1.0).
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. Chrome 140 on macOS 15.
